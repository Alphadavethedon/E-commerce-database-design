name: Database CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test_db
        ports:
          - "3306:3306"
    steps:
      - uses: actions/checkout@v3
      - run: mysql -h 127.0.0.1 -u root -proot test_db < sql/01_schema.sql
      - run: mysql -h 127.0.0.1 -u root -proot test_db -e "SHOW TABLES"